<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZORUVI | Operations Dashboard</title>

  <!-- FAVICON SVG OPTIMIZADO -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'%3E%3Cpolygon points='120,20 20,210 250,210' fill='%23FF7043'/%3E%3Cpolygon points='380,20 480,210 250,210' fill='%23FF7043'/%3E%3Cpolygon points='20,210 480,210 250,480' fill='%23E0562D'/%3E%3C/svg%3E">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos CSS Externos -->
  <link rel="stylesheet" href="dash_style.css">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="dash_script.js" defer></script>
</head>
<body class="dashboard-body">

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="brand-logo">
        <svg viewBox="0 0 500 500" style="width: 28px; height: 28px;">
          <polygon points="120,20 20,210 250,210" fill="#FF7043" />
          <polygon points="380,20 480,210 250,210" fill="#FF7043" />
          <polygon points="20,210 480,210 250,480" fill="#E0562D" />
        </svg>
        ZORUVI <span class="dashboard-badge">Dashboard</span>
      </a>
      <div class="nav-actions">
        <button class="btn btn-outline" onclick="handleLogout()">Log Out</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="dashboard-main">
    
    <!-- WELCOME CARD -->
    <div class="dashboard-welcome-card">
      <h2 class="dashboard-title">Welcome, <span id="userNameDisplay" class="text-primary">Loading...</span></h2>
      <p class="dashboard-subtitle">Email: <strong id="userEmailDisplay">...</strong> | Role: <strong id="userRoleDisplay" class="role-pill">...</strong></p>
    </div>

    <!-- LIVE METRICS SECTION -->
    <div class="dashboard-section-header">
      <h3 class="section-title" style="font-size: 1.5rem; text-align: left;">Your Live <span>Metrics</span></h3>
      <p class="section-subtitle" style="text-align: left; margin: 0;">Real-time performance updated based on your latest shift.</p>
    </div>

    <div class="metrics-grid dashboard-metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Average AHT</div>
        <div class="metric-value">325s <span class="status-pill good"></span></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">QA Score</div>
        <div class="metric-value">99.2% <span class="status-pill good"></span></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">SNPS</div>
        <div class="metric-value">+78 <span class="status-pill good"></span></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Adherence</div>
        <div class="metric-value">94.5% <span class="status-pill good"></span></div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ZORUVI.</p>
  </footer>
  
</body>
</html>
